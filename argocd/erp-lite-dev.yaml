apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erp-lite-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kaybe005/erp-lite.git
    targetRevision: main
    path: helm/erp-lite

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
