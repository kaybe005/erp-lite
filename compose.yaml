services:
  db:
    image: postgres:16
    container_name: erp-lite-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_lite
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_lite"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-lite-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/erp_lite?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: "bmVnP0IPmRMD60eAqc+Il9zllYK+HLUB5EjKmq1GWYU="
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
  

volumes:
  postgres_data: